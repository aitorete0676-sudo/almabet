<style>
/* Layout: barra superior verde oscuro, menú de deportes a la izquierda, eventos en el centro, boleto a la derecha */
:root{
  --top:#0c3326; --nav:#145a41; --nav2:#1b6e50;
  --bg:#232826; --panel:#2c3230; --panel2:#363d3a; --btn:#3d4542; --btnh:#4b5550; --line:#424a46;
  --fg:#f2f4f3; --muted:#a3aea9; --yellow:#f5d417; --ink:#14201b;
  --up:#2fbf7c; --down:#e5553f; --live:#e5553f;
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Helvetica Neue",Roboto,Arial,sans-serif; --f-cond:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Helvetica Neue",Roboto,Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
@media (max-width:760px){html{background:#121715}body{min-height:100vh;min-height:100dvh}}
html,body,button,a,input,select,label{touch-action:manipulation}
html{-webkit-text-size-adjust:100%}
@media (max-width:760px){input,select,textarea{font-size:16px!important}}
body{font-family:var(--f-body);font-size:14px;line-height:1.35}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--top)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--yellow);outline-offset:1px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.top{background:var(--top)}
.top .wrap{display:flex;align-items:center;gap:20px;min-height:54px;flex-wrap:wrap;padding-block:6px}
.logo{font-family:var(--f-cond);font-style:italic;font-weight:800;font-size:28px;letter-spacing:-.5px;color:var(--yellow);line-height:1}
.logo span{color:var(--fg)}
.tabs{display:flex;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none}
.tabs button{padding:8px 12px;font-weight:600;color:#cfe0d8;border-radius:3px;white-space:nowrap}
.tabs button:hover{color:#fff;background:rgba(255,255,255,.06)}
.tabs button.on{color:var(--yellow);box-shadow:inset 0 -3px 0 var(--yellow);border-radius:0}
.acct{display:flex;align-items:center;gap:10px;margin-left:auto}
.bal{font-family:var(--f-cond);font-weight:700;font-size:19px;color:var(--yellow);font-variant-numeric:tabular-nums}
.bal small{display:block;font-family:var(--f-body);font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ghost{border:1px solid #3c6b58;color:#cfe0d8;padding:5px 10px;border-radius:3px;font-size:12px;font-weight:600}
.ghost:hover{border-color:var(--yellow);color:var(--yellow)}
.sub{background:var(--nav)}
.sub .wrap{display:flex;align-items:center;gap:14px;min-height:36px;font-size:13px;flex-wrap:wrap;padding-block:4px}
.speed{display:flex;align-items:center;gap:4px;margin-left:auto;color:#cfe0d8}
.speed button{padding:3px 8px;border-radius:3px;font-weight:700;background:rgba(0,0,0,.18)}
.speed button.on{background:var(--yellow);color:var(--ink)}
.livepill{display:inline-flex;align-items:center;gap:6px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:11px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--live);box-shadow:0 0 0 0 var(--live);animation:pulse 1.6s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 6px rgba(229,85,63,0)}100%{box-shadow:0 0 0 0 rgba(229,85,63,0)}}

.grid{display:grid;grid-template-columns:200px minmax(0,1fr) 310px;gap:12px;padding-block:12px;align-items:start}
aside.side{background:var(--panel);border-radius:3px;overflow:hidden;position:sticky;top:110px}
.side h4{margin:0;padding:10px 12px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:var(--panel2)}
.side button{display:flex;width:100%;justify-content:space-between;padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;font-weight:500}
.side button:hover{background:var(--btn)}
.side button.on{color:var(--yellow);font-weight:700}
.side button[disabled]{color:#6f7a75;cursor:default}
.side .n{color:var(--muted);font-variant-numeric:tabular-nums}

main{min-width:0;display:flex;flex-direction:column;gap:12px}
.block{background:var(--panel);border-radius:3px;overflow:hidden}
.bh{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--panel2);font-weight:700}
.bh .sp{flex:1}
.bh .cols{display:grid;grid-template-columns:repeat(3,64px);gap:4px;text-align:center;font-size:12px;color:var(--muted);font-weight:600}
.row{display:grid;grid-template-columns:52px minmax(0,1fr) auto auto;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--line)}
.row:hover{background:#30373a10}
.clock{font-family:var(--f-cond);font-weight:700;font-size:15px;color:var(--live);font-variant-numeric:tabular-nums}
.clock.pre{color:var(--muted);font-size:13px;font-family:var(--f-body);font-weight:600}
.clock.ft{color:var(--muted)}
.teams{min-width:0;cursor:pointer}
.teams div{display:flex;justify-content:space-between;gap:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.teams b{font-variant-numeric:tabular-nums;color:var(--yellow);font-family:var(--f-cond);font-size:16px}
.teams .nm{overflow:hidden;text-overflow:ellipsis}
.reds{display:inline-block;width:8px;height:11px;background:var(--live);border-radius:1px;margin-left:5px;vertical-align:-1px}
.odds3{display:grid;grid-template-columns:repeat(3,64px);gap:4px}
.more{font-size:12px;color:var(--muted);font-weight:600;padding:4px 6px;white-space:nowrap}
.more:hover{color:var(--yellow)}
.o{position:relative;background:var(--btn);border-radius:3px;min-height:38px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 6px;font-variant-numeric:tabular-nums;transition:background .15s}
.o:hover{background:var(--btnh)}
.o .v{font-weight:700;color:var(--yellow);font-size:15px}
.o .l{font-size:12px;color:#d6ddd9;line-height:1.1;text-align:center}
.o.sel{background:#e4e8e6} .o.sel .l{color:#14201b} .o.sel .v{color:#1b8a5a}
.ck{width:20px;height:20px;fill:none;stroke:#1b8a5a;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;display:block}
.o.up::after,.o.down::after{content:"";position:absolute;right:4px;top:4px;border:5px solid transparent}
.o.up::after{border-bottom-color:var(--up);top:-1px}
.o.down::after{border-top-color:var(--down);top:5px}
.o.up .v{color:var(--up)} .o.down .v{color:#ff8a76}
.o.sel.up .v,.o.sel.down .v{color:var(--ink)}
.o[disabled]{cursor:not-allowed;opacity:.55}
.lock{width:12px;height:12px;fill:var(--muted)}
.empty{padding:22px 12px;color:var(--muted);text-align:center}

/* detalle */
.score{background:linear-gradient(180deg,#145a41,#0f4532);padding:16px 12px 14px;display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center}
.score .tn{font-family:var(--f-cond);font-weight:700;font-size:20px;line-height:1.1;text-wrap:balance}
.score .sc{font-family:var(--f-cond);font-weight:800;font-size:40px;color:var(--yellow);font-variant-numeric:tabular-nums;line-height:1}
.score .st{font-size:12px;color:#cfe0d8;margin-top:4px;font-weight:600}
.back{align-self:flex-start;font-size:13px;color:var(--muted);font-weight:600;padding:8px 0}
.back:hover{color:var(--yellow)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line)}
.stats div{background:var(--panel);padding:8px;text-align:center;font-size:12px;color:var(--muted)}
.stats b{display:block;color:var(--fg);font-size:15px;font-variant-numeric:tabular-nums}
.dom{padding:10px 12px;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.dom .bar{flex:1;height:6px;border-radius:3px;background:#5b6661;overflow:hidden;display:flex}
.dom .bar i{display:block;background:var(--yellow);transition:width .4s}
.mk{border-top:1px solid var(--line)}
.mk h5{margin:0;padding:9px 12px;font-size:13px;display:flex;justify-content:space-between;gap:8px}
.mk h5 span{color:var(--muted);font-weight:500;font-size:12px}
.mk .opts{display:grid;gap:4px;padding:0 12px 10px;grid-template-columns:repeat(var(--n),minmax(0,1fr))}
.susp{color:var(--yellow);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.tl{max-height:260px;overflow:auto;padding:4px 0}
.ev{display:grid;grid-template-columns:44px 18px minmax(0,1fr);gap:8px;padding:5px 12px;font-size:13px;align-items:center}
.ev .m{font-family:var(--f-cond);font-weight:700;color:var(--muted);text-align:right}
.ic{width:12px;height:12px;border-radius:2px;display:inline-block}
.ic.goal{border-radius:50%;background:#fff;box-shadow:inset 0 0 0 3px #222}
.ic.yel{background:var(--yellow);width:9px}
.ic.red{background:var(--live);width:9px}
.ic.att{background:transparent;border:2px solid var(--up);border-radius:50%}
.ic.info{background:var(--muted);border-radius:50%;width:8px;height:8px}
.model{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px}
th,td{padding:7px 12px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.ptab td.pc{padding:4px 6px;min-width:76px}
.ptab td.pc .o{min-height:34px}
.ptab th{text-align:center} .ptab th:first-child{text-align:left}
.stand tr.me td{color:var(--yellow);font-weight:700}
.adjr td{padding-top:0!important}.adj{display:flex;gap:6px;align-items:center}.adj input{width:90px;padding:6px 8px;border-radius:4px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.pwf{position:relative}.pwf input{width:100%;padding-right:78px!important}.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);padding:6px 10px;font-size:13px;font-weight:700;color:#145a41}
.co{display:flex;gap:8px;align-items:center;justify-content:flex-end;padding-top:8px;flex-wrap:wrap}.co span{font-size:13px;font-weight:600}.cobtn{background:var(--yellow);color:var(--ink);font-weight:700;border-radius:4px;padding:8px 12px}.cobtn:disabled{background:var(--btn);color:var(--muted);cursor:default}.cobtn.yes{background:var(--up);color:#fff}
.tag.cashout,.tag.void{background:var(--btn);color:var(--fg)}
/* boleto */
#slip .bh{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:10px;padding:12px 14px;background:#eef1ef;color:#14201b;position:sticky;top:0;z-index:2;border-radius:8px 8px 0 0}
#slip .bh .cnt{width:26px;height:26px;border-radius:50%;background:#1b6e50;color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px}
#slip .bh .bt{display:flex;flex-direction:column;font-size:18px;font-weight:800;line-height:1.15}
.sl-clear{color:#1b6e50;font-size:13px;font-weight:600;text-align:left;padding:0}
.sl-bal{display:flex;flex-direction:column;align-items:flex-end;font-weight:700;font-size:14px}.sl-bal small{font-weight:500;font-size:12px;color:#55615c}
.sl-close{font-size:18px;color:#14201b;padding:4px}
.sl-body{background:#fff;color:#14201b}
.sl-row{display:grid;grid-template-columns:24px minmax(0,1fr) auto 104px;gap:4px 10px;align-items:start;padding:12px 14px;border-bottom:1px solid #e3e7e5}
.sl-x{color:#55615c;font-size:15px;padding:2px 0}
.sl-main{display:flex;flex-direction:column;min-width:0}
.sl-pick{color:#145a41;font-size:16px;font-weight:800}
.sl-mk{font-weight:700;font-size:14px}.sl-m{font-size:13px;color:#55615c}.sl-chg{font-size:12px;color:#b45309;font-weight:600}
.sl-od{color:#14201b;font-weight:800;font-size:16px;font-variant-numeric:tabular-nums;align-self:start}
.sl-mini{display:none}
.pteam{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:4px 0 10px}
.pteam button{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-weight:700;font-size:13px;text-align:left;min-width:0}
.pteam button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pteam button.on{background:#fff;color:#14201b;border-color:#fff}
.pteam button:disabled{opacity:.4}
.pteam .tshirt{width:24px;height:24px;flex:none}
.sl-ea{display:inline-block;margin-top:3px;font-size:11px;font-weight:800;font-style:italic;text-transform:uppercase;color:#1b8a5a;letter-spacing:.02em}
.tagp{font-style:italic;font-weight:900;color:#3ddc97;letter-spacing:.03em;margin-left:6px;text-transform:uppercase;font-size:11px;border:1px solid #3ddc97;border-radius:3px;padding:0 4px}
.bst-wrap{margin:8px 0 12px}
.bst-h{display:flex;align-items:center;gap:10px;margin:0 0 8px}
.bst-h small{color:var(--muted);font-size:12px}
.bst-tag{background:linear-gradient(90deg,#f5d417,#ffb300);color:#14201b;font-weight:900;font-style:italic;text-transform:uppercase;font-size:13px;padding:3px 9px;border-radius:3px;letter-spacing:.03em}
.bst-list{display:flex;flex-direction:column;gap:6px}
.bst{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:2px 10px;align-items:center;background:var(--panel);border-left:3px solid #f5d417;border-radius:4px;padding:10px 10px 10px 12px}
.bst-t{font-weight:800;font-size:15px}
.bst-l{grid-column:1;font-size:13px;color:#c9d2ce;line-height:1.35}
.bst-o{grid-column:2;grid-row:1/3;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--btn);border-radius:4px;min-height:52px;font-variant-numeric:tabular-nums}
.bst-o s{font-size:12px;color:var(--muted)}.bst-o b{font-size:18px;color:#f5d417;font-weight:800}
.bst-o.sel{background:#e4e8e6}.bst-o.sel s{display:none}
.hm-odds b s{font-size:.6em;color:var(--muted);font-weight:600;margin-right:4px;vertical-align:middle}
.hm-odds.used{opacity:.55}.hm-odds.sel{background:#e4e8e6}.hm-odds.sel small{color:#3b4541}
.hm-cf{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto}
.bst-mini{background:linear-gradient(90deg,#f5d417,#ffb300);color:#14201b;font-weight:900;font-style:italic;text-transform:uppercase;font-size:10px;padding:2px 6px;border-radius:3px}
.slm-bar{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:2px 8px;align-items:start;background:#fff;color:#14201b;padding:12px 14px 12px 10px;cursor:pointer}
.slm-bar.multi{grid-template-columns:28px minmax(0,1fr) auto 44px}
.slm-x{color:#55615c;font-size:18px;line-height:1;padding:2px 0}
.slm-txt{display:flex;flex-direction:column;min-width:0;gap:1px}
.slm-txt .spk{color:#145a41;font-weight:800;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slm-txt .smk{font-weight:700;font-size:15px;color:#3b4541;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slm-txt .smt{font-size:14px;color:#6a7571;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slm-txt .scb{font-style:italic;font-weight:900;font-size:17px;text-transform:uppercase;letter-spacing:.2px;color:#3b4541}
.slm-txt .row1{display:flex;align-items:center;gap:8px;min-width:0}
.slm-pill{flex:none;border:2px solid #145a41;color:#145a41;border-radius:12px;padding:0 9px;font-weight:800;font-size:14px;line-height:20px}
.slm-od{font-weight:800;font-size:18px;font-variant-numeric:tabular-nums;padding-top:1px}
.slm-od .lock{width:14px;height:14px;fill:#8d9893}
.slm-up{align-self:stretch;border-left:1px solid #d5dbd8;display:grid;place-items:center;margin:-2px 0}
.slm-up i{width:11px;height:11px;border-left:2px solid #14201b;border-top:2px solid #14201b;transform:rotate(45deg);margin-top:5px}
.slm-btns{display:grid;grid-template-columns:1fr 1fr}
.slm-btns button{padding:15px 12px;font-size:17px;font-weight:800;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slm-set{background:#0f2a20;color:#3ddc97}
.slm-go{background:#7d8481;color:#e9ecea;text-align:center!important}
.slm-go.on{background:var(--yellow);color:var(--ink)}
.sl-in{width:100%;min-width:0;border:1px solid #9aa3a0;border-radius:3px;padding:9px 8px;font:inherit;font-size:16px;text-align:right;background:#fff;color:#14201b}
.sl-in::placeholder{color:#8d9893}
.dim .sl-pick,.dim .sl-mk,.dim .sl-m{opacity:.45}.dim .sl-od{opacity:.5}.dim .sl-in{opacity:.5}
.sl-combo{display:grid;grid-template-columns:minmax(0,1fr) auto 104px;gap:6px 10px;align-items:center;padding:14px;border-bottom:1px solid #e3e7e5}
.sl-combo b{color:#145a41;font-size:17px;font-weight:800}.sl-cod{font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
.sl-note{grid-column:1/-1;font-size:12px;color:#55615c}
.sl-tot{display:flex;justify-content:space-between;padding:12px 14px}.sl-tot div{display:flex;flex-direction:column}.sl-tot div+div{text-align:right}
.sl-tot small{font-size:12px;color:#55615c}.sl-tot b{font-size:17px}
.sl-body .msg{color:#c0392b;padding:0 14px 6px}
.sl-body .place{margin:0 14px 14px;width:calc(100% - 28px)}
.sl-ban{position:sticky;bottom:0;background:#0c3326;color:#fff;text-align:center;padding:10px 14px;font-weight:600;font-size:14px;display:flex;flex-direction:column;gap:2px}
.sl-ban button{color:#f5d417;font-weight:800;font-size:18px}
/* tarjeta de apuesta */
.bc-date{color:var(--muted);font-size:13px;padding:14px 12px 6px}
.bc{background:var(--panel2);border-radius:6px;margin:0 12px 6px;overflow:hidden}
.bc-hd{display:flex;justify-content:space-between;align-items:center;padding:14px 14px 10px}.bc-hd b{color:#3ddc97;font-size:18px}
.bc-btns{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 14px 10px}.bc-btns button{background:var(--btn);border-radius:4px;padding:9px 6px;font-weight:600;font-size:13px}
.bc-leg{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:start;padding:6px 14px}

  document.getElementById("liveCount").textContent = ms.filter(m => m.status === "live" || m.status === "ht").length + " en directo";
  document.getElementById("modeTxt").textContent = S.store === "loading" ? "Conectando…" : S.store === "sb" ? (S.me ? S.me + (S.admin ? " · Administrador" : "") : "") : S.store === "auth" ? "Inicia sesión para jugar" : S.store === "db" ? (S.admin ? "Partidos reales · Eres el administrador" : "Partidos reales · Dinero ficticio") : "Modo local: se guarda en este navegador y tú eres el administrador";
  document.querySelectorAll("#bnav button").forEach(b => b.classList.toggle("on", b.dataset.view === S.view || (S.view === "detail" && b.dataset.view === "home")));
  { const nl = ms.filter(m => m.status === "live" || m.status === "ht").length, nb = S.wallet.bets.filter(b => b.status === "pending").length;
    const a = document.getElementById("bnLive"), c = document.getElementById("bnBets"); a.hidden = !nl; a.textContent = nl; c.hidden = !nb; c.textContent = nb; }
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.view === S.view || (S.view === "detail" && b.dataset.view === "home")));
  patch(document.getElementById("side"), sideHTML());
  const v = S.view;
  { const lb = document.getElementById("lgBtn"); if (lb) { lb.hidden = S.store !== "sb" && S.store !== "noleague"; lb.textContent = (S.league_ ? S.league_.name : "Ligas") + " ▾"; } }
  patch(document.getElementById("main"), S.store === "auth" ? authView() : S.store === "noleague" || v === "ligas" ? ligasView() : v === "detail" ? detailView() : v === "bets" ? betsView() : v === "table" ? tableView() : v === "rank" ? rankingView() : v === "fut" ? futView() : v === "player" ? playerView() : v === "how" ? howView() : listView(v === "live"));
  const slip = document.getElementById("slip");
  patch(slip, slipHTML());

  const ci = slip.querySelector("input[data-combo]"); if (ci && document.activeElement !== ci) ci.value = S.combo;
  document.querySelectorAll("select[data-form]").forEach(s => { if (document.activeElement !== s) s.value = S.form[s.dataset.form]; });
  const fi = document.getElementById("ad-fecha"); if (fi && document.activeElement !== fi) { const m = findMatch(S.detail); fi.value = m ? (m.fecha || "") : ""; }
}

function place() {
  const d = slipData(); S.msg = "";
  if (S.store === "sb" && S.admin && (CUR_LG === "main" || S.super)) { S.msg = "La cuenta de administrador no apuesta. Entra con tu cuenta de jugador."; return render(); }
  if (d.some(x => x.m && x.m.closed)) { S.msg = "Ese partido ya ha empezado: no se puede apostar."; return render(); }
  if (d.some(x => !x.susp && x.odds !== x.added)) { S.msg = "Han cambiado las cuotas: acepta los cambios."; return render(); }
  const mk = legs => legs.map(x => ({ mid: x.mid, mk: x.mk, oc: x.oc, label: x.label, mname: x.mname, match: x.fut ? "Temporada · " + ((FUTS[x.mid] || FUTS.fut).LG0.nombre) : x.m.home.nombre + " v " + x.m.away.nombre, odds: x.odds, status: "pending",
    ...(x.m && x.mk === "1x2" && x.oc !== "X" && x.m.status === "pre" ? { ea: 1 } : {}) }));
  if (d.some(x => x.boost) && d.length > 1) { S.msg = "La SuperCuota va sola: no se puede combinar."; return render(); }
  if (d.some(x => x.boost && boostUsed(x.mid, x.label))) { S.msg = "Ya has apostado esta SuperCuota. Solo se puede una vez."; return render(); }
  if (d.some(x => x.boost && num(S.stakes[x.key]) > BOOST_MAX)) { S.msg = "En una SuperCuota el máximo son " + BOOST_MAX + " €."; return render(); }
  const W = S.wallet, items = d.filter(x => !x.susp && num(S.stakes[x.key]) > 0), cst = num(S.combo);
  const ci = cst > 0 ? comboInfo(d) : null;
  if (cst > 0 && (!ci || !ci.ok)) { S.msg = ci ? ci.why : "No se puede hacer la combinada."; return render(); }
  const total = items.reduce((t, x) => t + num(S.stakes[x.key]), 0) + cst;
  if (!total) { S.msg = "Escribe una cantidad."; return render(); }
  if (total > W.balance + 1e-9) { S.msg = "Saldo insuficiente."; return render(); }
  items.forEach(x => { const st = num(S.stakes[x.key]); W.balance = +(W.balance - st).toFixed(2); W.bets.push({ id: Date.now() + "-" + Math.random().toString(36).slice(2, 7), stake: st, odds: x.odds, legs: x.boost ? mk(x.legs) : mk([x]), status: "pending", at: Date.now(), j: (x.m && x.m.jornada) || 0, ...(x.boost ? { boost: x.label, was: x.was } : {}) }); });
  if (cst > 0) { W.balance = +(W.balance - cst).toFixed(2); W.bets.push({ id: Date.now() + "-c" + Math.random().toString(36).slice(2, 5), stake: cst, odds: ci.odds, legs: mk(d), status: "pending", at: Date.now(), j: Math.max(...d.map(x => (x.m && x.m.jornada) || 0)) }); }
  const nb = items.length + (cst > 0 ? 1 : 0);
  toast((nb > 1 ? nb + " apuestas realizadas" : "Apuesta realizada") + " · " + eur(total));
  S.slip = []; S.stakes = {}; S.combo = ""; S.slipOpen = false; saveWallet(); settle(); render();
}

document.addEventListener("click", e => {
  const t = e.target.closest("button,[data-open],[data-toggle],[data-obet]"); if (!t || t.disabled) return;
  const ds = t.dataset;
  if (ds.view) { S.view = ds.view; S.detail = null; window.scrollTo(0, 0); }
  else if (ds.open) { S.view = "detail"; S.detail = ds.open; S.form = { side: String(Math.max(0, sideOf(findMatch(ds.open)))), pl: "", as: "", min: "" }; window.scrollTo(0, 0); }
  else if (ds.league !== undefined) { S.league = ds.league || null; S.view = "home"; }
  else if (ds.player !== undefined) { S.view = "player"; S.player = +ds.player; S.q = ""; window.scrollTo(0, 0); }
  else if (ds.ftab) S.futTab = ds.ftab;
  else if (ds.lgo) return switchLg(ds.lgo);
  else if (ds.lgjoin) { const c = (document.getElementById("lg-code") || {}).value || "";
    api("joinLeague", { code: c }).then(j => switchLg(j.id), e => toast(e.message)); return; }
  else if (ds.compfind) { const u = (document.getElementById("cp-url") || {}).value || ""; S.lgCreate = { url: u, busy: "Buscando el grupo…" }; render();
    api("groupTeams", { group: u }).then(j => { S.lgCreate = { url: u, teams: j.teams, liga: j.liga }; render(); }, e => { S.lgCreate = { url: u }; toast(e.message); render(); }); return; }
  else if (ds.compadd) { const cr = S.lgCreate || {}, team = (document.getElementById("cp-team") || {}).value;
    S.lgCreate = { ...cr, busy: "Añadiendo…" }; render();
    api("addComp", { group: cr.url, team }).then(() => location.reload(), e => { S.lgCreate = { ...cr, busy: "" }; toast(e.message); render(); }); return; }
  else if (ds.lgcreate) { const name = (document.getElementById("lg-name") || {}).value || "";
    api("createLeague", { name }).then(j => { try { sessionStorage.setItem("ab-view", "ligas"); } catch (e) {} switchLg(j.id); }, e => toast(e.message)); return; }
  else if (ds.lgshare) { const url = location.origin + "/?unirse=" + ds.lgshare, txt = "Únete a mi liga de FFCVBet: " + url + " (código " + ds.lgshare + ")";
    if (navigator.share) navigator.share({ url }).catch(() => {}); else if (navigator.clipboard) navigator.clipboard.writeText(txt).then(() => toast("Enlace copiado")); return; }
  else if (ds.lgdel) S.lgDel = ds.lgdel;
  else if (ds.lgdelno) S.lgDel = null;
  else if (ds.lgdelyes) { const id = ds.lgdelyes; S.lgDel = null;
    api("deleteLeague", { id }).then(j => { S.leagues = j.leagues || []; toast("Liga eliminada"); if (id === CUR_LG) return switchLg("main"); render(); }, e => toast(e.message)); return; }
  else if (ds.kick) S.kickConfirm = ds.kick;
  else if (ds.kickno) S.kickConfirm = null;
  else if (ds.kickyes) { const u = ds.kickyes; S.kickConfirm = null; api("kickMember", { user: u }).then(() => { toast(u + " ya no está en la liga"); sbRanking(); }, e => toast(e.message)); return; }
  else if (ds.fpick) { const [, mk, oc] = ds.fpick.split("|"), i = S.slip.findIndex(s => s.key === ds.fpick);
    if (i >= 0) S.slip.splice(i, 1);
    else { useFut(ds.fpick.split("|")[0]); const k = futMarket(mk), o = k && k.outcomes.find(x => x.k === oc);
      if (o && o.odds != null) (S.slip = S.slip.filter(x => !x.boost)).push({ key: ds.fpick, mid: FUT, mk, oc, label: o.label, mname: k.name, added: o.odds, fut: 1 }); }
    S.msg = ""; }
  else if (ds.fadm) { if (!S.admin) return; const [a, k, mid] = ds.fadm.split("|"); useFut(mid || "fut"); futAdmin(a, k); return; }
  else if (ds.pbets) { if (!S.admin) return; if (ds.pbets === "-") S.pbets = null; else { S.pbets = { user: ds.pbets, bets: null };
      api("playerBets", { user: ds.pbets }).then(j => { if (S.pbets && S.pbets.user === ds.pbets) { S.pbets.bets = j.bets || []; render(); } }, e => { toast(e.message); S.pbets = null; render(); }); } }
  else if (ds.pick) {
    const [mid, mk, oc] = ds.pick.split("|"); const i = S.slip.findIndex(s => s.key === ds.pick);
    if (i >= 0) S.slip.splice(i, 1);
    else { const m = findMatch(mid), k = markets(m).list.find(x => x.key === mk), o = k.outcomes.find(x => x.k === oc);
      (S.slip = S.slip.filter(x => !x.boost)).push({ key: ds.pick, mid, mk, oc, label: o.label, mname: k.name, added: o.odds }); }
    S.msg = "";
  }
  else if (ds.rm) { S.slip = S.slip.filter(s => s.key !== ds.rm); delete S.stakes[ds.rm]; }
  else if (ds.mode) S.mode = ds.mode;
  else if (ds.adj) { const [u, sg] = ds.adj.split("|"), inp = document.getElementById("adj-" + u), v = num(inp && inp.value);
    if (!v) { toast("Escribe una cantidad."); return; }
    api("adjust", { user: u, amount: v * +sg }).then(() => { toast((+sg > 0 ? "Dados " : "Quitados ") + eur(v) + (+sg > 0 ? " a " : " a ") + u); if (inp) inp.value = ""; setTimeout(sbRanking, 500); }, e => toast(e.message)); return; }
  else if (ds.showpw) S.showPw = !S.showPw;
  else if (ds.co) S.coConfirm = ds.co;
  else if (ds.btab) S.betTab = ds.btab;
  else if (ds.rtab) S.rankTab = ds.rtab;
  else if (ds.pside) { const [mid, k] = ds.pside.split("|"); S.pside[mid] = +k; }
  else if (ds.hf) { S.hf = ds.hf; S.view = "home"; S.detail = null; }
  else if (ds.preset != null && ds.preset !== "") { const mine = allMatches().find(m => sideOf(m) >= 0 && m.status !== "ft"), c = mine && presetCombos(mine)[+ds.preset];
    if (c) { S.slip = S.slip.filter(x => !x.boost); c.d.forEach(x => { if (!S.slip.some(y => y.key === x.key)) S.slip.push({ key: x.key, mid: x.mid, mk: x.mk, oc: x.oc, label: x.label, mname: x.mname, added: x.odds }); });
      S.combo = S.combo || "10"; toast("Añadida al boleto: " + c.t); } }
  else if (ds.obet) S.openBet[ds.obet] = !t.closest(".bc");
  else if (ds.coNo) S.coConfirm = null;
  else if (ds.coYes) { doCashout(ds.coYes); return; }
  else if (ds.authTab) { S.authTab = ds.authTab; S.authMsg = ""; }
  else if (ds.logout) { api("logout").catch(() => {}).then(() => { try { localStorage.removeItem(TK); } catch (e) {} location.reload(); }); return; }
  else if (ds.acc === "adm") S.openG.adm = !(S.openG.adm ?? true);
  else if (ds.acc) S.openG[ds.acc] = !isOpen(ds.acc);
  else if (ds.cat) S.cat = ds.cat;
  else if (ds.ptab) { const [g, k] = ds.ptab.split("|"); S.ptab[g] = k; }
  else if (ds.more) S.more[ds.more] = !S.more[ds.more];
  else if (ds.quick) { const v = +ds.quick, add = x => String(Math.round((num(x) + v) * 100) / 100);
    if (S.mode === "combo") S.combo = add(S.combo); else S.slip.forEach(s => S.stakes[s.key] = add(S.stakes[s.key])); }
  else if (ds.clear) { S.slip = []; S.stakes = {}; S.combo = ""; S.msg = ""; }
  else if (ds.place) return place();
  else if (ds.accept) { slipData().forEach(x => { const s0 = S.slip.find(y => y.key === x.key); if (s0 && x.odds != null) s0.added = x.odds; }); S.msg = ""; }
  else if (ds.reuse) { const b = S.wallet.bets.find(x => x.id === ds.reuse); if (b) { b.legs.forEach(l => { const key = l.mid + "|" + l.mk + "|" + l.oc; if (S.slip.some(x => x.key === key)) return;
      const m = findMatch(l.mid), k = m && markets(m).list.find(x => x.key === l.mk), o = k && k.outcomes.find(x => x.k === l.oc);
      if (o && o.odds != null && m.status !== "ft") (S.slip = S.slip.filter(x => !x.boost)).push({ key, mid: l.mid, mk: l.mk, oc: l.oc, label: l.label, mname: k.name, added: o.odds }); });
      S.slipOpen = true; toast(S.slip.length ? "Selecciones añadidas al boleto" : "Esos mercados ya están cerrados"); } }
  else if (ds.share) { const b = S.wallet.bets.find(x => x.id === ds.share); if (b) { const txt = "Mi apuesta en FFCVBet: " + eur(b.stake) + " a " + fo(b.odds) + "\n" + b.legs.map(l => "· " + l.label + " (" + l.mname + ") " + l.match).join("\n") + "\n" + location.origin;
      if (navigator.share) navigator.share({ text: txt }).catch(() => {}); else navigator.clipboard && navigator.clipboard.writeText(txt).then(() => toast("Copiado para compartir")); } return; }
  else if (ds.toggle) S.slipOpen = !S.slipOpen;
  else if (ds.boost) { const i = ds.boost.indexOf("|"), mid = ds.boost.slice(0, i), t = ds.boost.slice(i + 1), key = "boost|" + mid + "|" + t, j = S.slip.findIndex(x => x.key === key);
    if (j >= 0) S.slip.splice(j, 1);
    else { const m = findMatch(mid), b = m && boosts(m).find(x => x.t === t);

    S.msg = ""; }
  else if (ds.setamt) { S.slipOpen = true; render(); const f = document.querySelector(S.slip.length > 1 ? "#slip input[data-combo]:not(:disabled)" : "#slip input[data-stake]:not(:disabled)"); if (f) f.focus(); return; }
  else if (ds.adm) { if (!S.admin) return; S.confirmReset = false;
    return adminAct(ds.mid, ds.adm, ds.adm === "dom" ? +ds.val : ds.adm === "setmin" ? S.form.min : undefined); }
  else if (ds.askReset) S.confirmReset = ds.askReset;
  else if (ds.cancelReset) S.confirmReset = false;
  else if (ds.walletReset) { S.wallet = { balance: DATA.saldoInicial, bets: [] }; S.confirmReset = false; saveWallet(); toast("Saldo reiniciado a " + eur(DATA.saldoInicial)); }
  else return;
  render();
});
document.addEventListener("input", e => {
  const i = e.target;
  if (i.dataset.search) { S.q = i.value; render(); return; }
  if (i.dataset.stake) S.stakes[i.dataset.stake] = i.value.replace(/[^\d.,]/g, "");
  else if (i.dataset.combo) S.combo = i.value.replace(/[^\d.,]/g, "");
  else if (i.dataset.form === "min") { S.form.min = i.value.replace(/\D/g, ""); return; }
  else return;
  S.msg = ""; render();
});
document.addEventListener("submit", e => { if (e.target.id === "auform") { e.preventDefault(); sbAuth(S.authTab === "up" ? "up" : "in"); } });
document.addEventListener("change", e => {
  const i = e.target;
  if (i.dataset.form && i.tagName === "SELECT") { S.form[i.dataset.form] = i.value; if (i.dataset.form === "side") { S.form.pl = ""; S.form.as = ""; } render(); }
  else if (i.dataset.fteam) { (S.futTeamM = S.futTeamM || {})[i.dataset.fteam] = +i.value; render(); }
  else if (i.dataset.admFecha && S.admin) adminAct(i.dataset.admFecha, "fecha", i.value);
});

render(); connect();
setInterval(() => { settle(); render(); }, 1000);
</script>
