<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0c3326">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AlmaBet">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script>if (/^\/admin/.test(location.pathname)) { document.querySelector('link[rel=manifest]').href = "/manifest-admin.json"; document.querySelector('link[rel=apple-touch-icon]').href = "/apple-touch-admin.png"; document.querySelector('meta[name=apple-mobile-web-app-title]').content = "AB Admin"; }</script>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="/config.js"></script>
</head>
<body>
<title>AlmaBet</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: barra superior verde oscuro, menú de deportes a la izquierda, eventos en el centro, boleto a la derecha */
:root{
  --top:#0c3326; --nav:#145a41; --nav2:#1b6e50;
  --bg:#232826; --panel:#2c3230; --panel2:#363d3a; --btn:#3d4542; --btnh:#4b5550; --line:#424a46;
  --fg:#f2f4f3; --muted:#a3aea9; --yellow:#f5d417; --ink:#14201b;
  --up:#2fbf7c; --down:#e5553f; --live:#e5553f;
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Helvetica Neue",Roboto,Arial,sans-serif; --f-cond:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Helvetica Neue",Roboto,Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
html,body,button,a,input,select,label{touch-action:manipulation}
html{-webkit-text-size-adjust:100%}
@media (max-width:760px){input,select,textarea{font-size:16px!important}}
body{font-family:var(--f-body);font-size:14px;line-height:1.35}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--top)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--yellow);outline-offset:1px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.top{background:var(--top)}
.top .wrap{display:flex;align-items:center;gap:20px;min-height:54px;flex-wrap:wrap;padding-block:6px}
.logo{font-family:var(--f-cond);font-style:italic;font-weight:800;font-size:28px;letter-spacing:-.5px;color:#fff;line-height:1}
.logo span{color:var(--yellow);position:relative;display:inline-block}
.logo span::after{content:"";position:absolute;left:8%;right:4%;bottom:-.14em;height:.11em;border-radius:.06em;background:var(--yellow)}
.tabs{display:flex;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none}
.tabs button{padding:8px 12px;font-weight:600;color:#cfe0d8;border-radius:3px;white-space:nowrap}
.tabs button:hover{color:#fff;background:rgba(255,255,255,.06)}
.tabs button.on{color:var(--yellow);box-shadow:inset 0 -3px 0 var(--yellow);border-radius:0}
.acct{display:flex;align-items:center;gap:10px;margin-left:auto}
.bal{font-family:var(--f-cond);font-weight:700;font-size:19px;color:var(--yellow);font-variant-numeric:tabular-nums}
.bal small{display:block;font-family:var(--f-body);font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ghost{border:1px solid #3c6b58;color:#cfe0d8;padding:5px 10px;border-radius:3px;font-size:12px;font-weight:600}
.ghost:hover{border-color:var(--yellow);color:var(--yellow)}
.sub{background:var(--nav)}
.sub .wrap{display:flex;align-items:center;gap:14px;min-height:36px;font-size:13px;flex-wrap:wrap;padding-block:4px}
.speed{display:flex;align-items:center;gap:4px;margin-left:auto;color:#cfe0d8}
.speed button{padding:3px 8px;border-radius:3px;font-weight:700;background:rgba(0,0,0,.18)}
.speed button.on{background:var(--yellow);color:var(--ink)}
.livepill{display:inline-flex;align-items:center;gap:6px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:11px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--live);box-shadow:0 0 0 0 var(--live);animation:pulse 1.6s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 6px rgba(229,85,63,0)}100%{box-shadow:0 0 0 0 rgba(229,85,63,0)}}

.grid{display:grid;grid-template-columns:200px minmax(0,1fr) 310px;gap:12px;padding-block:12px;align-items:start}
aside.side{background:var(--panel);border-radius:3px;overflow:hidden;position:sticky;top:110px}
.side h4{margin:0;padding:10px 12px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:var(--panel2)}
.side button{display:flex;width:100%;justify-content:space-between;padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;font-weight:500}
.side button:hover{background:var(--btn)}
.side button.on{color:var(--yellow);font-weight:700}
.side button[disabled]{color:#6f7a75;cursor:default}
.side .n{color:var(--muted);font-variant-numeric:tabular-nums}

main{min-width:0;display:flex;flex-direction:column;gap:12px}
.block{background:var(--panel);border-radius:3px;overflow:hidden}
.bh{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--panel2);font-weight:700}
.bh .sp{flex:1}
.bh .cols{display:grid;grid-template-columns:repeat(3,64px);gap:4px;text-align:center;font-size:12px;color:var(--muted);font-weight:600}
.row{display:grid;grid-template-columns:52px minmax(0,1fr) auto auto;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--line)}
.row:hover{background:#30373a10}
.clock{font-family:var(--f-cond);font-weight:700;font-size:15px;color:var(--live);font-variant-numeric:tabular-nums}
.clock.pre{color:var(--muted);font-size:13px;font-family:var(--f-body);font-weight:600}
.clock.ft{color:var(--muted)}
.teams{min-width:0;cursor:pointer}
.teams div{display:flex;justify-content:space-between;gap:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.teams b{font-variant-numeric:tabular-nums;color:var(--yellow);font-family:var(--f-cond);font-size:16px}
.teams .nm{overflow:hidden;text-overflow:ellipsis}
.reds{display:inline-block;width:8px;height:11px;background:var(--live);border-radius:1px;margin-left:5px;vertical-align:-1px}
.odds3{display:grid;grid-template-columns:repeat(3,64px);gap:4px}
.more{font-size:12px;color:var(--muted);font-weight:600;padding:4px 6px;white-space:nowrap}
.more:hover{color:var(--yellow)}
.o{position:relative;background:var(--btn);border-radius:3px;min-height:38px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 6px;font-variant-numeric:tabular-nums;transition:background .15s}
.o:hover{background:var(--btnh)}
.o .v{font-weight:700;color:var(--yellow);font-size:15px}
.o .l{font-size:12px;color:#d6ddd9;line-height:1.1;text-align:center}
.o.sel{background:var(--yellow)} .o.sel .v,.o.sel .l{color:var(--ink)}
.o.up::after,.o.down::after{content:"";position:absolute;right:4px;top:4px;border:5px solid transparent}
.o.up::after{border-bottom-color:var(--up);top:-1px}
.o.down::after{border-top-color:var(--down);top:5px}
.o.up .v{color:var(--up)} .o.down .v{color:#ff8a76}
.o.sel.up .v,.o.sel.down .v{color:var(--ink)}
.o[disabled]{cursor:not-allowed;opacity:.55}
.lock{width:12px;height:12px;fill:var(--muted)}
.empty{padding:22px 12px;color:var(--muted);text-align:center}

/* detalle */
.score{background:linear-gradient(180deg,#145a41,#0f4532);padding:16px 12px 14px;display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center}
.score .tn{font-family:var(--f-cond);font-weight:700;font-size:20px;line-height:1.1;text-wrap:balance}
.score .sc{font-family:var(--f-cond);font-weight:800;font-size:40px;color:var(--yellow);font-variant-numeric:tabular-nums;line-height:1}
.score .st{font-size:12px;color:#cfe0d8;margin-top:4px;font-weight:600}
.back{align-self:flex-start;font-size:13px;color:var(--muted);font-weight:600;padding:8px 0}
.back:hover{color:var(--yellow)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line)}
.stats div{background:var(--panel);padding:8px;text-align:center;font-size:12px;color:var(--muted)}
.stats b{display:block;color:var(--fg);font-size:15px;font-variant-numeric:tabular-nums}
.dom{padding:10px 12px;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.dom .bar{flex:1;height:6px;border-radius:3px;background:#5b6661;overflow:hidden;display:flex}
.dom .bar i{display:block;background:var(--yellow);transition:width .4s}
.mk{border-top:1px solid var(--line)}
.mk h5{margin:0;padding:9px 12px;font-size:13px;display:flex;justify-content:space-between;gap:8px}
.mk h5 span{color:var(--muted);font-weight:500;font-size:12px}
.mk .opts{display:grid;gap:4px;padding:0 12px 10px;grid-template-columns:repeat(var(--n),minmax(0,1fr))}
.susp{color:var(--yellow);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.tl{max-height:260px;overflow:auto;padding:4px 0}
.ev{display:grid;grid-template-columns:44px 18px minmax(0,1fr);gap:8px;padding:5px 12px;font-size:13px;align-items:center}
.ev .m{font-family:var(--f-cond);font-weight:700;color:var(--muted);text-align:right}
.ic{width:12px;height:12px;border-radius:2px;display:inline-block}
.ic.goal{border-radius:50%;background:#fff;box-shadow:inset 0 0 0 3px #222}
.ic.yel{background:var(--yellow);width:9px}
.ic.red{background:var(--live);width:9px}
.ic.att{background:transparent;border:2px solid var(--up);border-radius:50%}
.ic.info{background:var(--muted);border-radius:50%;width:8px;height:8px}
.model{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px}
th,td{padding:7px 12px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.ptab td.pc{padding:4px 6px;min-width:76px}
.ptab td.pc .o{min-height:34px}
.ptab th{text-align:center} .ptab th:first-child{text-align:left}
.stand tr.me td{color:var(--yellow);font-weight:700}
.adjr td{padding-top:0!important}.adj{display:flex;gap:6px;align-items:center}.adj input{width:90px;padding:6px 8px;border-radius:4px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.pwf{position:relative}.pwf input{width:100%;padding-right:78px!important}.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);padding:6px 10px;font-size:13px;font-weight:700;color:#145a41}
.co{display:flex;gap:8px;align-items:center;justify-content:flex-end;padding-top:8px;flex-wrap:wrap}.co span{font-size:13px;font-weight:600}.cobtn{background:var(--yellow);color:var(--ink);font-weight:700;border-radius:4px;padding:8px 12px}.cobtn:disabled{background:var(--btn);color:var(--muted);cursor:default}.cobtn.yes{background:var(--up);color:#fff}
.tag.cashout,.tag.void{background:var(--btn);color:var(--fg)}
.ptbl{margin:0 -12px}
.ptbl .pr{display:grid;grid-template-columns:minmax(0,1fr) repeat(var(--n),minmax(52px,64px));align-items:center;border-top:1px solid var(--line);min-height:56px}
.ptbl .ph{min-height:44px}
.ptbl .ph span{font-weight:700;font-size:13px;text-align:center;line-height:1.15;padding:0 2px}
.ptbl .ph span:first-child{text-align:left;padding-left:12px}
.ptbl .pn{display:flex;align-items:center;gap:6px;min-width:0;padding:6px 4px 6px 8px;border-right:1px solid var(--line);align-self:stretch}
.ptbl .pnt{display:flex;flex-direction:column;min-width:0}
.ptbl .pnt b{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ptbl .pnt span{font-size:12px;color:var(--yellow);font-weight:600}
.shirt{width:38px;height:38px;flex:none;margin-left:-4px}
.ptbl .o{background:none;border-radius:0;height:56px;justify-content:center}
.ptbl .o .v{color:#3ddc97;font-size:15px;font-weight:600}
.ptbl .o.sel{background:var(--yellow)}.ptbl .o.sel .v{color:var(--ink)}
.ptbl .o:disabled .v{color:var(--muted)}
.vermas{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-top:1px solid var(--line);font-weight:600;font-size:15px}
.acc.open .ptbl .vermas .chev{transform:rotate(45deg);margin-top:-5px}.acc.open .ptbl .vermas .chev.up{transform:rotate(-135deg);margin-top:5px}
.ptabs{display:flex;gap:4px;padding:8px 12px;overflow-x:auto;border-bottom:1px solid var(--line)}
.ptabs button{padding:6px 12px;border-radius:14px;background:var(--btn);font-weight:600;font-size:13px;white-space:nowrap}
.ptabs button.on{background:var(--yellow);color:var(--ink)}
.plist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:16px;padding:0 12px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 76px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.prow .pn{min-width:0;display:flex;flex-direction:column}
.prow .pn b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .pn span{font-size:12px;color:var(--muted)}
@media (max-width:760px){.plist{grid-template-columns:minmax(0,1fr)}}
.mkts{background:transparent;overflow:visible;display:flex;flex-direction:column;gap:6px}
.cats{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.cats button{padding:7px 13px;border-radius:16px;background:var(--panel);font-weight:600;font-size:13px;white-space:nowrap}
.cats button.on{background:var(--yellow);color:var(--ink)}
.suspbar{background:#4a4116;color:var(--yellow);padding:8px 12px;border-radius:3px;font-weight:700;font-size:13px}
.acc{background:var(--panel);border-radius:6px;overflow:hidden}
.acch{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;padding:15px 14px;font-weight:700;font-size:16px;text-align:left}
.acch:hover{background:var(--panel2)}
.tagj{display:block;font-family:var(--f-cond);font-style:italic;font-weight:800;font-size:12px;letter-spacing:.03em;color:var(--up);text-transform:uppercase;margin-top:2px}
.chev{width:10px;height:10px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .2s;flex:none;margin-right:4px}
.acc.open .chev{transform:rotate(-135deg)}
.accb{padding:0 14px 14px;display:grid;gap:8px}
.accb .opts{padding:0;display:grid;gap:4px;grid-template-columns:repeat(var(--n),minmax(0,1fr))}
.subh{font-size:12px;color:var(--muted);font-weight:600;margin-top:4px}
.ltab{display:grid;gap:4px}
.ltab .lh,.ltab .lr{display:grid;grid-template-columns:minmax(0,1fr) 90px 90px;gap:6px;align-items:center}
.ltab .lh span{font-size:12px;color:var(--muted);text-align:center}
.ltab .lr>span{font-weight:600;font-variant-numeric:tabular-nums}
.csg .lh3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;font-size:12px;color:var(--muted);text-align:center;margin-bottom:4px}
.csg .lh3 span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.csc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:6px}
.csc>div{display:grid;gap:4px;align-content:start}
.accb .ptabs{padding:0 0 4px;border:0}
.accb .plist{padding:0}
.showall{color:var(--yellow);font-weight:600;font-size:13px;padding:6px 0;justify-self:start}
.ic.sot,.ic.sh{background:transparent;border:2px solid var(--fg);border-radius:50%;width:10px;height:10px}
.ic.sh{border-style:dashed;border-color:var(--muted)}
.ic.cor{background:transparent;width:0;height:0;border-left:6px solid var(--up);border-top:6px solid transparent;border-bottom:6px solid transparent;border-radius:0}
.authb{max-width:420px;margin:24px auto;padding:20px 18px;display:grid;gap:12px;text-align:center;width:100%}
.authb p{color:var(--muted);margin:0}
.authf{display:grid;gap:8px;text-align:left}
.authf label{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.authf input{background:#fff;color:#111;border:0;border-radius:4px;padding:12px;font:inherit;font-size:16px}
.authf .place{margin:8px 0 0;width:100%}
.mine{box-shadow:inset 3px 0 0 var(--yellow)}
.note{padding:10px 12px;font-size:13px;color:var(--muted)}
.note code{color:var(--yellow);font-family:ui-monospace,Consolas,monospace;font-size:12px}

/* boleto */
.slip{position:sticky;top:110px;background:var(--panel);border-radius:3px;overflow:hidden}
.slip .bh{background:var(--yellow);color:var(--ink)}
.cnt{background:var(--ink);color:var(--yellow);border-radius:10px;padding:0 7px;font-size:12px;font-variant-numeric:tabular-nums}
.stabs{display:grid;grid-template-columns:1fr 1fr;background:var(--panel2)}
.stabs button{padding:9px;font-weight:600;color:var(--muted)}
.stabs button.on{color:var(--fg);box-shadow:inset 0 -2px 0 var(--yellow)}
.sel-it{padding:10px 12px;border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px}
.sel-it .t{font-weight:700}
.sel-it .s{font-size:12px;color:var(--muted);grid-column:1}
.sel-it .od{font-weight:700;color:var(--yellow);text-align:right;font-variant-numeric:tabular-nums}
.sel-it .x{color:var(--muted);font-size:18px;line-height:1;padding:0 2px}
.sel-it .x:hover{color:var(--fg)}
.sel-it .chg{font-size:11px;color:var(--muted);text-align:right}
.stake{grid-column:1/-1;display:flex;gap:6px;align-items:center;margin-top:6px}
.stake input{width:100%;min-width:0;background:#fff;color:#111;border:0;border-radius:3px;padding:8px;font:inherit;font-weight:600;font-variant-numeric:tabular-nums}
.stake .ret{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:4px;padding:0 12px 10px;flex-wrap:wrap}
.chips button{background:var(--btn);padding:4px 9px;border-radius:3px;font-size:12px;font-weight:600}
.chips button:hover{background:var(--btnh)}
.tot{padding:10px 12px;border-top:1px solid var(--line);display:grid;gap:4px;font-variant-numeric:tabular-nums}
.tot div{display:flex;justify-content:space-between}
.tot .big{font-weight:700;font-size:15px}
.place{margin:0 12px 12px;width:calc(100% - 24px);background:var(--up);color:#06150e;font-weight:700;padding:12px;border-radius:3px;font-size:15px}
.place:hover{filter:brightness(1.08)}
.place[disabled]{background:var(--btn);color:var(--muted);cursor:not-allowed}
.msg{padding:0 12px 10px;font-size:12px;color:#ff9b88;min-height:0}
.slip .empty{font-size:13px}
.slipbar{display:none}

/* mis apuestas */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line)}
.kpis div{background:var(--panel);padding:10px 12px}
.kpis small{display:block;font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.kpis b{font-size:18px;font-variant-numeric:tabular-nums;font-family:var(--f-cond)}
.bet{border-top:1px solid var(--line);padding:10px 12px;display:grid;gap:4px}
.bet .hd{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:2px}
.tag.pending{background:#4b5550;color:var(--fg)} .tag.won{background:var(--up);color:#06150e} .tag.lost{background:var(--down);color:#fff} .tag.void{background:#6b7570;color:#fff}
.leg{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:10px}
.leg .r-won{color:var(--up)} .leg .r-lost{color:#ff8a76}
.pos{color:var(--up)} .neg{color:#ff8a76}

/* cómo funciona */
.how{padding:4px 16px 16px;max-width:70ch}

/* ===================== MODELO DE CUOTAS ===================== */
const MARGIN = { "1x2": 0.07, dc: 0.05, ou25: 0.06, btts: 0.06, next: 0.07 };
const fact = [1]; for (let i = 1; i < 20; i++) fact[i] = fact[i - 1] * i;
const pois = (k, l) => Math.exp(-l) * Math.pow(l, k) / fact[k];
const poisArr = (l, n = 12) => Array.from({ length: n }, (_, k) => pois(k, l));

// Goles esperados a 90' a partir del nivel de cada equipo (con ventaja de campo)
function lambdasFromRatings(rh, ra) {
  const d = (rh + 3 - ra) / 35;
  return { h: 1.35 * Math.exp(d), a: 1.10 * Math.exp(-d) };
}
function p1x2(lh, la, hg = 0, ag = 0) {
  const ph = poisArr(lh), pa = poisArr(la);
  let p1 = 0, px = 0, p2 = 0;
  for (let x = 0; x < ph.length; x++) for (let y = 0; y < pa.length; y++) {
    const p = ph[x] * pa[y], dh = hg + x, da = ag + y;
    if (dh > da) p1 += p; else if (dh === da) px += p; else p2 += p;
  }
  const s = p1 + px + p2; return { p1: p1 / s, px: px / s, p2: p2 / s };
}
// Fuerza de ataque y defensa a partir de la clasificación (modelo tipo Maher/Dixon-Coles simplificado)
const HOME_ADV = 1.12;
function leagueStats(lg) {
  const T = lg.equipos.filter(e => e.pj > 0); if (!T.length) return null;
  const mu = T.reduce((s, e) => s + e.gf, 0) / T.reduce((s, e) => s + e.pj, 0);   // goles por equipo y partido
  const ppg = T.reduce((s, e) => s + e.pts, 0) / T.reduce((s, e) => s + e.pj, 0);
  return { mu, ppg };
}
function strength(e, L) {
  if (!L || !(e.pj > 0)) return null;
  const w = e.pj / (e.pj + 4);                     // con pocos partidos, se acerca a la media
  const pts5 = e.racha ? [...e.racha].reduce((s, c) => s + (c === "G" ? 3 : c === "E" ? 1 : 0), 0) / e.racha.length : e.pts / e.pj;
  const ppg = 0.65 * e.pts / e.pj + 0.35 * pts5;                       // puntos de la temporada + racha reciente
  const form = Math.pow((ppg + 0.3) / (L.ppg + 0.3), 0.25);            // corrigen un poco lo que dicen los goles
  const att = (1 - w) + w * (e.gf / e.pj) / L.mu, def = (1 - w) + w * (e.gc / e.pj) / L.mu;
  return { att: Math.pow(att * form, 0.85), def: Math.pow(def / form, 0.85) };   // 0,85 suaviza los extremos
}
function lambdasFromTable(h, a, L) {
  const sh = strength(h, L), sa = strength(a, L); if (!sh || !sa) return null;
  return { h: L.mu * HOME_ADV * sh.att * sa.def, a: L.mu / HOME_ADV * sa.att * sh.def, sh, sa };
}
// Ajuste inverso: de cuotas 1X2 a goles esperados (búsqueda en rejilla)
function lambdasFromOdds(c) {
  const inv = [1 / c["1"], 1 / c["X"], 1 / c["2"]], s = inv[0] + inv[1] + inv[2];
  const t = inv.map(v => v / s); let best = null;
  for (let h = 0.2; h <= 4.01; h += 0.05) for (let a = 0.2; a <= 4.01; a += 0.05) {
    const p = p1x2(h, a), e = (p.p1 - t[0]) ** 2 + (p.px - t[1]) ** 2 + (p.p2 - t[2]) ** 2;
    if (!best || e < best.e) best = { e, h, a };
  }
  return { h: best.h, a: best.a, overround: s - 1 };
}
function roundOdds(o) {
  if (o < 3) return Math.round(o * 100) / 100;
  if (o < 10) return Math.round(o * 20) / 20;
  if (o < 30) return Math.round(o * 2) / 2;
  return Math.round(o);
}
function price(p, m) {
  if (p < 0.004 || p > 0.993) return null;           // mercado prácticamente decidido: se cierra
  // El margen pesa más en los resultados igualados y casi nada en los muy probables (así no salen cuotas por debajo de 1)
  return Math.min(201, Math.max(1.01, roundOdds(1 / (p * (1 + 1.5 * m * (1 - p))))));
}
// Ritmo de gol por minuto de cada equipo, según lo que pasa en el partido
function rates(m) {
  let h = m.base.h, a = m.base.a;
  h *= Math.pow(0.72, m.red[0]) * Math.pow(1.18, m.red[1]);   // roja: el que se queda con 10 marca menos y encaja más
  a *= Math.pow(0.72, m.red[1]) * Math.pow(1.18, m.red[0]);
  h *= Math.pow(0.98, m.yel[0]); a *= Math.pow(0.98, m.yel[1]); // amarillas: algo más de prudencia
  h *= 1 + 0.25 * m.mom; a *= 1 - 0.25 * m.mom;                 // dominio del partido
  if (m.minute >= 70) {                                         // el que pierde arriesga al final
    const d = m.hg - m.ag;
    if (d < 0) { h *= 1.25; a *= 1.1; } else if (d > 0) { a *= 1.25; h *= 1.1; }

  return { h: h / 90, a: a / 90 };

const PLAYER_MARGIN = 0.10;

const POS_W = { POR: { g: 0, a: 0.1, y: 0.3 }, CEN: { g: 0.5, a: 0.5, y: 1.5 }, DEF: { g: 0.5, a: 0.8, y: 1.5 }, LAT: { g: 0.5, a: 1, y: 1.3 },

// Peso de cada jugador: cuánto juega (titularidades cuentan entero, entrar desde el banquillo un 35 %)

const TEAM_PJ = Math.max(1, ...(DATA.plantilla || []).map(p => p.conv || p.pj || 1));

  if (p.tit == null) { const w = posW(p.posicion);   // formato antiguo, por posición

async function api(action, body) {

async function applyBonus(list) {

    fresh.forEach(x => { S.wallet.balance = Math.max(0, +(S.wallet.balance + x.amount).toFixed(2));
      (S.wallet.moves = S.wallet.moves || []).unshift({ amount: x.amount, note: x.note, at: x.at });

/* ===================== LIQUIDACIÓN ===================== */
function legResult(leg, m) {
  const fin = m.status === "ft", F = [m.hg, m.ag], tg = m.hg + m.ag, k = leg.mk, oc = leg.oc, W = c => c ? "won" : "lost";
  const num_ = str => parseFloat(str), ix = oc === "h" ? 0 : 1, htDone = ["ht", "2h", "ft"].includes(m.phase);
  if (k === "1x2") return fin ? W(oc === res3(...F)) : null;
  if (k === "dc") return fin ? W(oc.includes(res3(...F))) : null;
  if (k === "btts") { if (F[0] > 0 && F[1] > 0) return W(oc === "Y"); return fin ? W(oc === "N") : null; }
  if (/^ou/.test(k)) { const l = k === "ou25" ? 2.5 : num_(k.slice(2)); if (tg > l) return W(oc === "O"); return fin ? W(oc === "U") : null; }
  if (/^tg[ha]/.test(k)) { const v = F[k[2] === "h" ? 0 : 1], l = num_(k.slice(3)); if (v > l) return W(oc === "O"); return fin ? W(oc === "U") : null; }
  if (/^int/.test(k)) { const [a, b, h] = INTERVALS[+k.slice(3)];
    if (m.st.events.some(e => e.t === "goal" && evHalf(e) === h && e.min >= a && e.min <= b)) return W(oc === "Y");
    const done = fin || (h === 1 && htDone) || (h === 2 && b < 90 && m.phase === "2h" && m.minute > b);
    return done ? W(oc === "N") : null; }
  if (k === "htft") { if (htDone && res3(...m.ht) !== oc[0]) return "lost"; return fin ? W(oc === res3(...m.ht) + res3(...F)) : null; }
  if (k === "cs") { if (oc !== "other") { const [h, a] = oc.split("-").map(Number); if (F[0] > h || F[1] > a) return "lost"; return fin ? W(F[0] === h && F[1] === a) : null; }
    if (F[0] > 5 || F[1] > 5) return "won"; return fin ? "lost" : null; }
  if (k === "half") return fin ? W(oc === res3(m.ht[0] + m.ht[1], m.h2[0] + m.h2[1])) : null;
  if (k === "mrg") { if (!fin) return null; const d = F[0] - F[1];
    return W({ h1: d === 1, h2: d === 2, h3: d >= 3, d: d === 0, a1: d === -1, a2: d === -2, a3: d <= -3 }[oc]); }
  if (k === "wtn") { if (F[1 - ix] > 0) return "lost"; return fin ? W(F[ix] > 0) : null; }
  if (k === "sbh") { if (m.ht[ix] > 0 && m.h2[ix] > 0) return "won"; if (htDone && m.ht[ix] === 0) return "lost"; return fin ? "lost" : null; }
  if (k === "wbh") { if (htDone && !(m.ht[ix] > m.ht[1 - ix])) return "lost"; return fin ? W(m.h2[ix] > m.h2[1 - ix]) : null; }
  if (/^crn\d/.test(k)) { const t = m.corners[0] + m.corners[1], l = num_(k.slice(3)); if (t > l) return W(oc === "O"); return fin ? W(oc === "U") : null; }
  if (k === "crnw") return fin ? W(oc === res3(...m.corners)) : null;
  if (/^crd\d/.test(k)) { const t = m.cards[0] + m.cards[1], l = num_(k.slice(3)); if (t > l) return W(oc === "O"); return fin ? W(oc === "U") : null; }
  if (k === "bcrd") { if (m.cards[0] > 0 && m.cards[1] > 0) return W(oc === "Y"); return fin ? W(oc === "N") : null; }
  if (k === "crdw") return fin ? W(oc === res3(...m.cards)) : null;
  if (k === "pcs") { const c = sideOf(m) ? m.hg : m.ag; if (c > 0) return W(oc === "N"); return fin ? W(oc === "Y") : null; }
  if (k.startsWith("next")) { const n = +k.slice(4);
    if (m.goals.length >= n) return W(oc === m.goals[n - 1]); return fin ? W(oc === "none") : null; }
  if (k[0] === "p") { const st = m.ps[+oc]; if (!st) return null;
    const need = { pg1: st.g >= 1, pg2: st.g >= 2, pg3: st.g >= 3, pga: st.g + st.a >= 1, pas: st.a >= 1, pye: st.y >= 1 || !!st.r,
      pst1: st.sot >= 1, pst2: st.sot >= 2, pst3: st.sot >= 3, psh1: st.sh >= 1, psh2: st.sh >= 2, psh3: st.sh >= 3 }[k];
    if (need) return "won"; return fin ? "lost" : null; }
  return null;
}
function settle() {
  if (S.store === "loading" || S.store === "auth") return;
  let changed = false;
  S.wallet.bets.forEach(b => {
    if (b.status !== "pending") return;
    b.legs.forEach(l => { if (l.status === "pending") { const m = findMatch(l.mid); const r = m && legResult(l, m); if (r) { l.status = r; changed = true; } } });
    if (b.legs.some(l => l.status === "lost")) { b.status = "lost"; b.ret = 0; changed = true; }
    else if (b.legs.every(l => l.status === "won")) { b.status = "won"; b.ret = +(b.stake * b.odds).toFixed(2); S.wallet.balance = +(S.wallet.balance + b.ret).toFixed(2); changed = true; toast("Apuesta ganada: +" + eur(b.ret)); }
  });
  if (changed) saveWallet();
}

/* ===================== CERRAR APUESTA (cash out) ===================== */
// Antes de que empiece ningún partido del boleto: se anula y se devuelve todo.
// Con algún partido empezado: vale lo que pagaría × probabilidad actual de acertar, menos un 6 %.
const CASHOUT_MARGIN = 0.06;
function cashoutInfo(b) {
  if (b.status !== "pending" || b.legs.some(l => l.status === "lost")) return null;
  const ms = {}; b.legs.forEach(l => { ms[l.mid] = ms[l.mid] || findMatch(l.mid); });
  if (Object.values(ms).some(m => !m)) return null;
  if (Object.values(ms).every(m => m.status === "pre")) return { kind: "void", amount: b.stake };
  let P = 1;
  const groups = {}; b.legs.filter(l => l.status !== "won").forEach(l => (groups[l.mid] ??= []).push(l));
  for (const mid in groups) { const m = ms[mid], g = groups[mid];
    if (m.suspended || m.status === "ft") return { kind: "closed" };
    if (g.length > 1) { P *= jointProb(m, g.map(l => ({ mk: l.mk, oc: l.oc }))); continue; }
    const k = markets(m).list.find(x => x.key === g[0].mk), o = k && k.outcomes.find(x => x.k === g[0].oc);
    if (!o || o.odds == null || o.p == null) return { kind: "closed" };
    P *= o.p;
  }
  const amount = Math.floor(b.stake * b.odds * P * (1 - CASHOUT_MARGIN) * 100) / 100;
  return amount >= 0.01 ? { kind: "cash", amount } : { kind: "closed" };
}
function doCashout(id) {
  const b = S.wallet.bets.find(x => x.id === id), ci = b && cashoutInfo(b);
  S.coConfirm = null;
  if (!ci || ci.kind === "closed") { toast("Ahora mismo no se puede cerrar esta apuesta."); return render(); }
  b.status = ci.kind === "void" ? "void" : "cashout"; b.ret = ci.amount; b.closedAt = Date.now();
  S.wallet.balance = +(S.wallet.balance + ci.amount).toFixed(2);
  toast(ci.kind === "void" ? "Apuesta anulada: te devolvemos " + eur(ci.amount) : "Apuesta cerrada: +" + eur(ci.amount));
  saveWallet(); render();
}

/* ===================== ADMIN: lo que pasa en el partido ===================== */
function adminAct(id, act, arg) {
  const f = FIX.find(x => x.id === id); if (!f) return;
  const st = JSON.parse(JSON.stringify({ ...blankState(), ...(S.states[id] || {}) })), now = Date.now(), m = build(f);
  if (act === "start") { st.phase = "1h"; st.k1 = now; }
  else if (act === "ht") st.phase = "ht";
  else if (act === "2h") { st.phase = "2h"; st.k2 = now; }
  else if (act === "ft") st.phase = "ft";
  else if (act === "reopen") st.phase = st.k2 ? "2h" : "1h";
  else if (act === "reset") { Object.assign(st, blankState(), { fecha: st.fecha }); }
  else if (act === "setmin") { const v = Math.max(1, Math.min(120, +arg || 1));
    if (st.phase === "1h" || (st.phase === "pre" && v <= 45)) { st.phase = "1h"; st.k1 = now - (v - 1) * 60000; }
    else { st.phase = "2h"; st.k2 = now - (v - 46) * 60000; if (!st.k1) st.k1 = st.k2 - 60 * 60000; } }
  else if (act === "dom") st.dom = arg;
  else if (act === "susp") st.susp = !st.susp;
  else if (act === "fecha") st.fecha = arg;
  else if (act === "undo") st.events.pop();
  else if (["goal", "yel", "red", "sot", "sh", "cor"].includes(act)) {
    if (st.phase === "pre") { toast("Primero pulsa «Empezar partido»."); return; }
    const s = +S.form.side, mine = s === sideOf(m);
    const e = { t: act, s, min: m.minute, x: m.extra || 0, h: st.phase === "1h" || st.phase === "ht" ? 1 : 2, at: now };
    if (mine && S.form.pl !== "") e.p = +S.form.pl;
    if (act === "goal" && mine && S.form.as !== "" && S.form.as !== S.form.pl) e.as = +S.form.as;
    st.events.push(e);
    if (act === "goal" || act === "red") st.suspUntil = now + 45000;   // tras gol o roja, mercados cerrados 45 s
    S.form.pl = ""; S.form.as = "";
  }
  saveMatch(id, st); settle();
}

let toastT; function toast(t) { const el = document.getElementById("toast"); el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 2600); }

  return d.toLocaleDateString("es-ES", { weekday: "short", day: "numeric", month: "numeric" }) + " " + d.toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" }); };

function oddBtn(m, mkt, oc, showLabel) {
  const key = m.id + "|" + mkt.key + "|" + oc.k;
  const prev = S.prev[key], now = Date.now();
  if (prev != null && oc.odds != null && prev !== oc.odds) S.flash[key] = { dir: oc.odds > prev ? "up" : "down", until: now + 4000 };
  S.prev[key] = oc.odds;
  const fl = S.flash[key] && S.flash[key].until > now ? S.flash[key].dir : "";
  const closed = oc.odds == null || m.suspended;
  const sel = S.slip.some(s => s.key === key);
  const inner = (showLabel ? `<span class="l">${esc(oc.label)}</span>` : "") + `<span class="v">${closed ? LOCK : fo(oc.odds)}</span>`;
  return `<button class="o ${sel ? "sel" : ""} ${fl}" data-pick="${key}" ${closed ? "disabled" : ""} aria-label="${esc(oc.label)} ${fo(oc.odds)}">${inner}</button>`;

function howView() {
  return `<div class="block how">
  <h3>1. Partidos reales</h3><p>AlmaBet no se inventa nada. El administrador mete lo que pasa en el campo: inicio, goles con goleador y asistente, tarjetas, descanso y final. Con cada dato las cuotas se recalculan al momento para todos.</p>
  <h3>2. Goles esperados desde la clasificación</h3><p>Primero se saca la media de goles del grupo por equipo y partido. Cada equipo tiene un <b>ataque</b> (sus goles a favor por partido entre la media) y una <b>defensa</b> (sus goles en contra por partido entre la media). Los puntos (65 % temporada, 35 % racha de los últimos 5) corrigen un poco. Con pocos partidos jugados, los valores se acercan a la media.</p>
  <p>Goles esperados del local = <code>media × ${HOME_ADV} × ataque local × defensa visitante</code>. Los del visitante = <code>media / ${HOME_ADV} × ataque visitante × defensa local</code>.</p>
  <h3>3. Distribución de Poisson</h3><p>Los goles que faltan siguen una Poisson con media <code>goles esperados × minutos restantes / 90</code>. Con el marcador real salen las probabilidades de 1, X y 2, más de 2,5, ambos marcan y siguiente gol.</p>
  <h3>4. Lo que pasa en el partido</h3><ul>
    <li>Gol: cambia el marcador y cierra los mercados 45 segundos.</li>
    <li>Tiempo: cada minuto quedan menos goles esperados.</li>
    <li>Roja: el equipo con 10 marca un 28 % menos y el rival un 18 % más.</li>
    <li>Amarillas: −2 % de ritmo por tarjeta.</li>
    <li>Quién domina: el administrador lo marca y mueve el ritmo un ±15 %.</li>
    <li>Desde el 70', el que pierde arriesga: +25 % para él y +10 % para el rival.</li></ul>
  <h3>5. Apuestas de jugador</h3><p>Cada jugador tiene un peso según lo que juega (titularidades enteras, entrar desde el banquillo cuenta un 35 %) y sus goles por partido de la temporada. Su probabilidad de marcar es <code>1 − e^(−goles esperados del equipo × su parte)</code>. Si marca, se paga al momento. Si le expulsan, sus mercados se cierran.</p>
  <h3>6. Margen de la casa</h3><p>Cuota = <code>1 / (prob × (1 + 1,5 × margen × (1 − prob)))</code>. Con un 7 % de margen, un resultado al 50 % paga 1,90 en vez de 2,00.</p>
  <h3>7. Combinadas</h3><p>Entre partidos distintos, las cuotas se multiplican. Si combinas varias del mismo partido (crear apuesta), como están relacionadas, la app simula el resto del partido 4.000 veces y cuenta en cuántas se cumplen todas; a esa probabilidad le aplica un 10 % de margen.</p>
  <h3>8. Liquidación</h3><p>Más de 2,5, ambos marcan y las de jugador se pagan en cuanto se cumplen. El resto, al final. Una combinada se pierde si falla una sola selección.</p></div>`;
}

// Las selecciones de un mismo partido están relacionadas (si Moliner marca, es más fácil que gane el Almazora).

  const myRate = my === 0 ? r.h : r.a;
  const sh = m.base.h / (m.base.h + m.base.a), cH = CORNERS_PER_MATCH * (0.5 + (sh - 0.5) * 0.7) / 92, cA = CORNERS_PER_MATCH / 92 - cH;
  const kH = (my === 0 ? YEL_RATE * 90 : OPP_CARDS) / 92, kA = (my === 1 ? YEL_RATE * 90 : OPP_CARDS) / 92;
  const f = { ...m, status: "ft", phase: "ft", hg: m.hg, ag: m.ag, ht: [...m.ht], h2: [...m.h2], goals: [...m.goals], corners: [...m.corners], cards: [...m.cards],
    ps: m.ps.map(p => ({ ...p })), st: { ...m.st, events: [...m.st.events] } };
  const start1 = m.phase === "1h" ? m.minute : 0, start2 = m.phase === "2h" ? m.minute : 45;
  const gl = [];
  [[r1, 1, start1, 45], [r2, 2, start2, 90]].forEach(([len, h, a, b]) => { if (len <= 0) return;
    [0, 1].forEach(s => { const n = rpois((s ? r.a : r.h) * len); for (let i = 0; i < n; i++) gl.push({ s, h, min: Math.min(b, Math.max(a + 1, Math.ceil(a + Math.random() * (b - a)))) }); }); });
  gl.sort((x, y) => x.h - y.h || x.min - y.min).forEach(g => {
    if (g.s) f.ag++; else f.hg++; f.goals.push(g.s ? "a" : "h"); (g.h === 1 ? f.ht : f.h2)[g.s]++;

    const extraSot = rpois(lg * (1 / SOT_CONV - 1)); ps.sot += extraSot; ps.sh += extraSot + rpois(lg * (1 / SHOT_CONV - 1 / SOT_CONV));

const simCache = {};
function jointProb(m, legs) {
  const key = m.id + "|" + legs.map(l => l.mk + ":" + l.oc).sort().join(",") + "|" + m.phase + m.minute + "|" + m.st.events.length + "|" + (m.st.dom || 0);
  if (simCache[key] != null) return simCache[key];
  let ok = 0;
  for (let i = 0; i < NSIM; i++) { const f = simulateFinal(m); if (legs.every(l => legResult(l, f) === "won")) ok++; }
  return simCache[key] = ok / NSIM;
}
// Cuota total de un boleto combinado: partidos distintos se multiplican; selecciones del mismo partido, por simulación
function comboInfo(d) {
  if (d.length < 2) return { ok: false, why: "Añade al menos 2 selecciones." };
  if (new Set(d.map(x => x.key)).size < d.length) return { ok: false, why: "Hay selecciones repetidas." };
  const groups = {}; d.forEach(x => (groups[x.mid] ??= []).push(x));
  let odds = 1; const parts = [];

    const m = g[0].m, p = jointProb(m, g.map(x => ({ mk: x.mk, oc: x.oc })));
    if (p < 0.003) return { ok: false, why: "Esas selecciones del mismo partido no pueden darse a la vez." };

}

/* DOM diff mínimo para no perder el foco ni los clics al refrescar */
function morph(a, b) {
  if (a.nodeType !== b.nodeType || a.nodeName !== b.nodeName) { a.replaceWith(b.cloneNode(true)); return; }
  if (a.nodeType === 3) { if (a.nodeValue !== b.nodeValue) a.nodeValue = b.nodeValue; return; }
  if (a.nodeType !== 1) return;
  for (const at of b.attributes) if (a.getAttribute(at.name) !== at.value) a.setAttribute(at.name, at.value);
  for (const at of [...a.attributes]) if (!b.hasAttribute(at.name)) a.removeAttribute(at.name);
  const ac = [...a.childNodes], bc = [...b.childNodes];
  bc.forEach((n, i) => ac[i] ? morph(ac[i], n) : a.appendChild(n.cloneNode(true)));
  for (let i = bc.length; i < ac.length; i++) ac[i].remove();
}
function patch(el, html) { const t = document.createElement(el.tagName); t.innerHTML = html; for (const at of el.attributes) t.setAttribute(at.name, at.value); morph(el, t); }

function place() {
  const d = slipData(); S.msg = "";
  if (S.store === "sb" && S.admin) { S.msg = "La cuenta de administrador no apuesta. Entra con tu cuenta de jugador."; return render(); }
  if (d.some(x => x.susp)) { S.msg = "Hay mercados suspendidos o cerrados."; return render(); }
  const mk = legs => legs.map(x => ({ mid: x.mid, mk: x.mk, oc: x.oc, label: x.label, mname: x.mname, match: x.m.home.nombre + " v " + x.m.away.nombre, odds: x.odds, status: "pending" }));
  const W = S.wallet;
  if (S.mode === "single") {
    const items = d.filter(x => num(S.stakes[x.key]) > 0);
    const total = items.reduce((s, x) => s + num(S.stakes[x.key]), 0);
    if (total > W.balance) { S.msg = "Saldo insuficiente."; return render(); }
    items.forEach(x => { const st = num(S.stakes[x.key]); W.balance = +(W.balance - st).toFixed(2); W.bets.push({ id: Date.now() + "-" + Math.random().toString(36).slice(2, 7), stake: st, odds: x.odds, legs: mk([x]), status: "pending", at: Date.now() }); });
    toast(items.length + (items.length > 1 ? " apuestas realizadas" : " apuesta realizada") + " · " + eur(total));
  } else {
    const st = num(S.combo); if (st > W.balance) { S.msg = "Saldo insuficiente."; return render(); }
    const ci = comboInfo(d); if (!ci.ok) { S.msg = ci.why; return render(); }
    const odds = ci.odds;
    W.balance = +(W.balance - st).toFixed(2); W.bets.push({ id: Date.now() + "-c", stake: st, odds, legs: mk(d), status: "pending", at: Date.now() });
    toast("Combinada realizada · " + eur(st) + " a " + fo(odds));
  }
  S.slip = []; S.stakes = {}; S.combo = ""; saveWallet(); settle(); render();
}

  else if (i.dataset.admFecha && S.admin) adminAct(i.dataset.admFecha, "fecha", i.value);
});

render(); connect();
setInterval(() => { settle(); render(); }, 1000);
</script>
